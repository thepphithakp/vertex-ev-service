apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ev-service.fullname" . }}
  labels:
    {{- include "ev-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ev-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ev-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.db.sslMode | quote }}
            - name: DB_SEARCH_PATH
              value: {{ .Values.db.searchPath | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.notification.serviceURL | quote }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ .Values.shutdown.drainDelay | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.shutdown.timeout | quote }}
            # ── ค่าลับ อ่านจาก Secret ทั้งหมด ────────────────────────────────
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: password
            - name: JWT_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.publicKeysSecret }}
                  # ชื่อ key ต้องตรงกับ Secret จริงที่ pet-service และ auth-service ใช้ร่วมกัน
                  key: keys
            - name: PUSH_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  # ⚠️ ต้องเป็น Secret เดียวกับที่ notification-service ถือ — ใช้
                  # ยืนยันตัวตนตอนเรียก POST /api/v1/internal/push/send ข้าม service
                  name: {{ .Values.notification.tokenSecret }}
                  key: token
            {{- with .Values.jwt.issuer }}
            - name: JWT_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.jwt.audience }}
            - name: JWT_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
